<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>

    <linearGradient id="tealBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <linearGradient id="amberBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F766E" flood-opacity="0.12" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Card Canvas -->
  <rect x="10" y="10" width="580" height="480" rx="32" fill="url(#bgGrad)" stroke="#99F6E4" stroke-width="2" filter="url(#softShadow)" />

  <!-- Grid Pattern Overlay -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0D9488" stroke-width="1" opacity="0.08" />
  </pattern>
  <rect x="10" y="10" width="580" height="480" rx="32" fill="url(#grid)" />

  <!-- === CENTRAL WORKER ILLUSTRATION CARD === -->
  <g transform="translate(140, 110)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="320" height="280" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Header Banner -->
    <rect x="0" y="0" width="320" height="80" rx="24" fill="url(#tealBadge)" />
    <!-- Rounded bottom correction -->
    <rect x="0" y="60" width="320" height="20" fill="url(#tealBadge)" />

    <!-- Avatar Circle -->
    <circle cx="160" cy="80" r="42" fill="#FFFFFF" filter="url(#cardShadow)" />
    <circle cx="160" cy="80" r="38" fill="url(#amberBadge)" />
    <!-- Avatar Icon (Worker Helmet / Cap Silhouette) -->
    <path d="M 144 76 Q 160 58 176 76 L 180 84 L 140 84 Z" fill="#FFFFFF" />
    <circle cx="160" cy="94" r="10" fill="#FFFFFF" />

    <!-- Worker Name & Specialty -->
    <text x="160" y="146" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#0F172A" text-anchor="middle">Budi Santoso</text>
    <text x="160" y="168" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#0F766E" text-anchor="middle">Teknisi Listrik &amp; Servis AC</text>

    <!-- Rating Stars & Review Count -->
    <g transform="translate(100, 182)">
      <path d="M 10 0 L 13 7 L 20 7 L 14 11 L 16 18 L 10 14 L 4 18 L 6 11 L 0 7 L 7 7 Z" fill="#F59E0B" />
      <path d="M 30 0 L 33 7 L 40 7 L 34 11 L 36 18 L 30 14 L 24 18 L 26 11 L 20 7 L 27 7 Z" fill="#F59E0B" />
      <path d="M 50 0 L 53 7 L 60 7 L 54 11 L 56 18 L 50 14 L 44 18 L 46 11 L 40 7 L 47 7 Z" fill="#F59E0B" />
      <path d="M 70 0 L 73 7 L 80 7 L 74 11 L 76 18 L 70 14 L 64 18 L 66 11 L 60 7 L 67 7 Z" fill="#F59E0B" />
      <path d="M 90 0 L 93 7 L 100 7 L 94 11 L 96 18 L 90 14 L 84 18 L 86 11 L 80 7 L 87 7 Z" fill="#F59E0B" />
    </g>
    <text x="160" y="222" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#334155" text-anchor="middle">5.0 ★ (128 Ulasan)</text>

    <!-- Verified Badge Pill -->
    <rect x="80" y="238" width="160" height="28" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1" />
    <text x="160" y="257" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#0F766E" text-anchor="middle">✓ AI VERIFIED MITRA PEKERJA</text>
  </g>

  <!-- === TOP LEFT FLOATING BADGE: ACTIVE STATUS === -->
  <g transform="translate(30, 40)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="210" height="48" rx="24" fill="#FFFFFF" stroke="#CCFBF1" stroke-width="1.5" />
    <circle cx="24" cy="24" r="6" fill="#10B981" />
    <text x="40" y="29" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0F766E">1,420 Pekerja Online</text>
  </g>

  <!-- === TOP RIGHT FLOATING BADGE: ESCROW GUARANTEE === -->
  <g transform="translate(370, 40)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="200" height="48" rx="24" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="1.5" />
    <text x="100" y="29" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#D97706" text-anchor="middle">🛡️ Escrow Garansi 100%</text>
  </g>

  <!-- === BOTTOM LEFT FLOATING CARD: UPAH HARIAN === -->
  <g transform="translate(30, 410)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="230" height="54" rx="27" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="28" cy="27" r="16" fill="#CCFBF1" />
    <text x="28" y="32" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#0F766E" text-anchor="middle">💰</text>
    <text x="56" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#0F172A">Rp 250.000 / Hari</text>
    <text x="56" y="40" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#64748B">Standar Upah Harian Transparan</text>
  </g>

  <!-- === BOTTOM RIGHT FLOATING CARD: ESTIMASI TIBA === -->
  <g transform="translate(350, 410)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="54" rx="27" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="1.5" />
    <circle cx="28" cy="27" r="16" fill="#FEF3C7" />
    <text x="28" y="32" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#D97706" text-anchor="middle">⚡</text>
    <text x="56" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#0F172A">~15 Menit Tiba</text>
    <text x="56" y="40" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#64748B">Estimasi Penanganan Cepat</text>
  </g>
</svg>
