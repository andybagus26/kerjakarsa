<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Teal Gradient for Icon Base -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    
    <!-- Amber Accent Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    
    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Mark (Badge Icon) -->
  <g transform="translate(10, 10)">
    <!-- Shield / Rounded Box Base -->
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#tealGrad)" filter="url(#shadow)" />

    <!-- Stylized "K" Hands / Sparks Icon -->
    <!-- Vertical Pillar -->
    <path d="M 32 26 C 32 22, 38 22, 38 26 L 38 74 C 38 78, 32 78, 32 74 Z" fill="#FFFFFF" />
    
    <!-- Upper Diagonal Hand (Teal-White) -->
    <path d="M 38 50 L 62 26 C 65 23, 71 27, 67 31 L 46 54 Z" fill="#FFFFFF" />
    
    <!-- Lower Diagonal Spark (Amber Accent) -->
    <path d="M 42 48 L 65 71 C 69 75, 63 80, 59 76 L 37 54 Z" fill="url(#amberGrad)" />

    <!-- AI / Craft Spark Icon (Top Right) -->
    <path d="M 74 20 L 76 25 L 81 27 L 76 29 L 74 34 L 72 29 L 67 27 L 72 25 Z" fill="url(#amberGrad)" />
  </g>

  <!-- Logo Text Typography -->
  <g transform="translate(130, 72)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="48" letter-spacing="-1">
      <tspan fill="#0F766E">Kerja</tspan>
      <tspan fill="#F59E0B">Karsa</tspan>
    </text>
    <text y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="1">
      EKOSISTEM PEKERJA INFORMAL DIGITAL
    </text>
  </g>
</svg>
